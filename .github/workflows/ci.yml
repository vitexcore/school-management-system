name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_management
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school -d school_management"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://school:school@localhost:5432/school_management?schema=public
      ACCESS_TOKEN_SECRET: ci-access-secret-long-enough-1234567890
      REFRESH_TOKEN_SECRET: ci-refresh-secret-long-enough-1234567890
      CSRF_SECRET: ci-csrf-secret-long-enough-1234567890
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Migrate test database
        working-directory: server
        run: npx prisma migrate deploy
      - name: Lint backend JavaScript syntax
        working-directory: server
        run: find src test prisma -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test backend
        working-directory: server
        run: npm test
      - name: Audit backend dependencies
        working-directory: server
        run: npm audit
      - name: Build frontend
        working-directory: client
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: client
        run: npm audit
